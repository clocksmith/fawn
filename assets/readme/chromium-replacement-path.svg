<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">Doe Chromium WebGPU replacement path</title>
  <desc id="desc">A black and white diagram showing a Web application using navigator.gpu through Chromium, an explicit runtime selector, the Doe WebGPU runtime replacing Dawn, the Doe WGSL compiler replacing Tint, native graphics APIs, and source-to-result receipts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" />
    </marker>
    <style>
      text { fill: #111111; font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 29px; font-weight: 800; letter-spacing: -.01em; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #444444; }
      .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; }
      .label { font-size: 17px; font-weight: 750; }
      .detail { font-size: 13px; font-weight: 500; fill: #333333; }
      .small { font-size: 12px; font-weight: 650; fill: #333333; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .soft { fill: #f3f3f3; stroke: #111111; stroke-width: 1.5; }
      .line { fill: none; stroke: #111111; stroke-width: 1.6; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #555555; stroke-width: 1.3; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="570" fill="#ffffff" />
  <rect x="18" y="18" width="1364" height="534" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.3" />

  <text x="50" y="60" class="eyebrow">CHROMIUM WEBGPU CUTOVER</text>
  <text x="50" y="96" class="title">Replace the implementation, preserve the WebGPU contract</text>
  <text x="50" y="124" class="subtitle">The application API and Chromium process model stay in place; Doe takes ownership below the runtime seam.</text>

  <rect x="50" y="174" width="205" height="104" rx="6" class="box" />
  <text x="152.5" y="211" text-anchor="middle" class="label">Web application</text>
  <text x="152.5" y="239" text-anchor="middle" class="detail mono">navigator.gpu</text>
  <text x="152.5" y="260" text-anchor="middle" class="small">API unchanged</text>

  <rect x="305" y="174" width="220" height="104" rx="6" class="box" />
  <text x="415" y="211" text-anchor="middle" class="label">Chromium</text>
  <text x="415" y="238" text-anchor="middle" class="detail">Blink + GPU process</text>
  <text x="415" y="260" text-anchor="middle" class="small">sandbox preserved</text>

  <rect x="575" y="174" width="220" height="104" rx="6" class="soft" />
  <text x="685" y="207" text-anchor="middle" class="label">Runtime selector</text>
  <text x="685" y="236" text-anchor="middle" class="detail mono">dawn | doe | auto</text>
  <text x="685" y="260" text-anchor="middle" class="small">explicit fallback policy</text>

  <rect x="845" y="174" width="220" height="104" rx="6" class="box" />
  <text x="955" y="207" text-anchor="middle" class="label">Doe runtime</text>
  <text x="955" y="236" text-anchor="middle" class="detail">WebGPU ABI + Zig core</text>
  <text x="955" y="260" text-anchor="middle" class="small">replaces Dawn</text>

  <rect x="1115" y="174" width="235" height="104" rx="6" class="box" />
  <text x="1232.5" y="207" text-anchor="middle" class="label">Native graphics APIs</text>
  <text x="1232.5" y="236" text-anchor="middle" class="detail">Metal · Vulkan · D3D12</text>
  <text x="1232.5" y="260" text-anchor="middle" class="small">driver + GPU</text>

  <path d="M 255 226 L 305 226" class="line" />
  <path d="M 525 226 L 575 226" class="line" />
  <path d="M 795 226 L 845 226" class="line" />
  <path d="M 1065 226 L 1115 226" class="line" />

  <rect x="845" y="332" width="220" height="112" rx="6" class="box" />
  <text x="955" y="367" text-anchor="middle" class="label">Doe compiler</text>
  <text x="955" y="394" text-anchor="middle" class="detail">WGSL to typed Doe IR</text>
  <text x="955" y="416" text-anchor="middle" class="detail">MSL / SPIR-V / DXIL</text>
  <text x="955" y="436" text-anchor="middle" class="small">replaces Tint</text>
  <path d="M 955 278 L 955 332" class="line" />
  <path d="M 1065 388 C 1110 388 1120 292 1190 278" class="line" />

  <rect x="575" y="478" width="775" height="46" rx="6" class="soft" />
  <text x="962.5" y="506" text-anchor="middle" class="label">Source / lowering / backend / command graph / result receipts</text>
  <path d="M 685 278 L 685 478" class="dash" />
  <path d="M 955 444 L 955 478" class="dash" />
  <path d="M 1232 278 L 1232 478" class="dash" />

  <text x="50" y="505" class="small">Forced Doe: initialization or capability failure is explicit.</text>
  <text x="50" y="524" class="small">Auto: Dawn remains a typed fallback until promotion gates pass.</text>
</svg>
