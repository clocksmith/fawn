<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Doe: technical architecture</title><desc id="desc">Red converging flows show the independently callable WGSL compiler and resource preparation feeding command recording, then backend submission to an external driver and GPU. Observed completion returns results and permits retirement only after references are released.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.edge-label{paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c93248" stroke-width="1.6"/></marker><marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657083" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="1198" height="698" rx="18" fill="white" stroke="#dce1e9" stroke-width="1.4"/>
<text x="36" y="43" font-size="24" fill="#c93248" font-weight="700" text-anchor="start">doe</text>
<text x="1164" y="42" font-size="11" fill="#657083" font-weight="600" text-anchor="end">TECHNICAL ARCHITECTURE</text>
<text x="36" y="84" font-size="25" fill="#202735" font-weight="600" text-anchor="start">Prepared code and bound resources meet in recorded work</text>
