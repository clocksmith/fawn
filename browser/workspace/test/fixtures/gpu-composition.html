<!doctype html>
<meta charset="utf-8">
<title>Fawn workspace GPU composition control</title>
<button id="run">Run GPU work</button>
<canvas id="canvas" width="8" height="8"></canvas>
<script>
document.querySelector('#run').onclick = async () => {
  document.querySelector('#run').disabled = true;
  let device;
  let context;
  const buffers = [];
  const report = { queueCompleted: false };
  try {
    if (!navigator.gpu) throw new Error('WebGPU unavailable');
    const adapter = await navigator.gpu.requestAdapter({ forceFallbackAdapter: false });
    if (!adapter) throw new Error('no WebGPU adapter');
    report.adapter = { vendor: adapter.info.vendor, architecture: adapter.info.architecture,
      device: adapter.info.device, description: adapter.info.description,
      isFallbackAdapter: adapter.info.isFallbackAdapter ?? null };
    if (report.adapter.isFallbackAdapter === true) throw new Error('software adapter rejected');
    device = await adapter.requestDevice();
    device.pushErrorScope('validation');
    const buffer = (size, usage) => {
      const value = device.createBuffer({ size, usage });
      buffers.push(value);
      return value;
    };
    const input = new Float32Array([1, 2, 3, 4, 5, 6, 7, 8]);
    const storage = buffer(input.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC);
    const readback = buffer(input.byteLength, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ);
    device.queue.writeBuffer(storage, 0, input);
    const compute = device.createComputePipeline({ layout: 'auto', compute: {
      module: device.createShaderModule({ code: `
        @group(0) @binding(0) var<storage, read_write> values: array<f32>;
        @compute @workgroup_size(1) fn main(@builtin(global_invocation_id) id: vec3<u32>) {
          if (id.x < 8u) { values[id.x] = values[id.x] * 2.0; }
        }` }), entryPoint: 'main' } });
    context = document.querySelector('#canvas').getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: 'opaque',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const render = device.createRenderPipeline({ layout: 'auto',
      vertex: { module: device.createShaderModule({ code: `
        @vertex fn main(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
          var positions = array<vec2<f32>, 3>(vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0));
          return vec4<f32>(positions[i], 0.0, 1.0);
        }` }), entryPoint: 'main' },
      fragment: { module: device.createShaderModule({ code: `
        @fragment fn main() -> @location(0) vec4<f32> { return vec4<f32>(0.0, 1.0, 0.0, 1.0); }` }),
        entryPoint: 'main', targets: [{ format }] } });
    const pixels = buffer(256 * 8, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ);
    const texture = context.getCurrentTexture();
    const commands = device.createCommandEncoder();
    const dispatch = commands.beginComputePass();
    dispatch.setPipeline(compute);
    dispatch.setBindGroup(0, device.createBindGroup({ layout: compute.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: storage } }] }));
    dispatch.dispatchWorkgroups(8);
    dispatch.end();
    commands.copyBufferToBuffer(storage, 0, readback, 0, input.byteLength);
    const draw = commands.beginRenderPass({ colorAttachments: [{ view: texture.createView(),
      loadOp: 'clear', storeOp: 'store', clearValue: { r: 1, g: 0, b: 1, a: 1 } }] });
    draw.setPipeline(render);
    draw.draw(3);
    draw.end();
    commands.copyTextureToBuffer({ texture }, { buffer: pixels, bytesPerRow: 256, rowsPerImage: 8 }, [8, 8]);
    device.queue.submit([commands.finish()]);
    await Promise.all([readback.mapAsync(GPUMapMode.READ), pixels.mapAsync(GPUMapMode.READ)]);
    report.values = Array.from(new Float32Array(readback.getMappedRange()));
    const mapped = new Uint8Array(pixels.getMappedRange());
    report.pixels = [];
    for (let y = 0; y < 8; y++) report.pixels.push(...mapped.slice(y * 256, y * 256 + 32));
    readback.unmap();
    pixels.unmap();
    await device.queue.onSubmittedWorkDone();
    report.queueCompleted = true;
    const validation = await device.popErrorScope();
    if (validation) throw new Error(validation.message);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    report.canvasFrames = 2;
    report.format = format;
  } catch (error) {
    report.error = String(error.stack ?? error);
  } finally {
    for (const value of buffers) value.destroy();
    context?.unconfigure();
    device?.destroy();
  }
  await fetch('/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(report) });
  const receipt = document.createElement('p');
  receipt.id = report.error ? 'failed' : 'completed';
  receipt.textContent = report.error ?? 'GPU work completed';
  document.body.append(receipt);
};
</script>
