<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>compute_workgroup_atomic_1024 with canvas</title>
<style>html,body{margin:0;background:#000;height:100%}canvas{display:block;width:100vw;height:100vh}#status{position:fixed;left:8px;bottom:8px;color:#fff;font:12px monospace}</style>
</head>
<body>
<canvas id="view"></canvas><span id="status">Connecting…</span>
<script type="module">
// Harness page: the repo's compute_workgroup_atomic_1024 L1 row
// (source_kernel_dispatch_oracle_v2, sha256_exact_v1) with its result
// presented through a WebGPU canvas. Kernel, dispatch shape, repeat count,
// buffer size, initialization and expected digest are read from the repo files.
const statusEl = document.getElementById("status");
const S = { state: "init", error: null, oracle: null, ops: [], finalOracle: null };
globalThis.__computeBench = S;
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
const VIS = `
@group(0) @binding(0) var<storage, read> vals : array<u32>;
@vertex fn vs(@builtin(vertex_index) i : u32) -> @builtin(position) vec4f {
  let p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
  return vec4f(p[i], 0, 1);
}
@fragment fn fs(@builtin(position) pos : vec4f) -> @location(0) vec4f {
  let x = u32(pos.x) % 1024u;
  let y = u32(pos.y) % 256u;
  let v = vals[y * 1024u + x];
  return vec4f(f32(v & 255u), f32((v >> 8u) & 255u), f32((v >> 16u) & 255u), 255.0) / 255.0;
}`;
try {
  const [kernelSource, commands] = await Promise.all([
    fetch("/repo/bench/kernels/workgroup_atomic.wgsl").then((r) => r.text()),
    fetch("/repo/examples/workgroup_atomic_commands.json").then((r) => r.json()),
  ]);
  const cmd = commands[0];
  const oracle = cmd.output_oracle;
  const size = cmd.bindings[0].buffer_size;
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) throw new Error("No GPU adapter");
  const device = await adapter.requestDevice();
  const context = document.getElementById("view").getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  const view = document.getElementById("view");
  view.width = Math.floor(view.clientWidth * devicePixelRatio);
  view.height = Math.floor(view.clientHeight * devicePixelRatio);
  context.configure({ device, format, alphaMode: "opaque" });
  const buffer = device.createBuffer({ size, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  const zeros = new Uint8Array(size);
  device.queue.writeBuffer(buffer, 0, zeros);
  const bgl = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.COMPUTE,
    buffer: { type: "storage", minBindingSize: size } }] });
  const pipeline = device.createComputePipeline({ layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
    compute: { module: device.createShaderModule({ code: kernelSource }), entryPoint: "main" } });
  const bg = device.createBindGroup({ layout: bgl, entries: [{ binding: 0, resource: { buffer } }] });
  const vbgl = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT,
    buffer: { type: "read-only-storage", minBindingSize: size } }] });
  const vmod = device.createShaderModule({ code: VIS });
  const vpipe = device.createRenderPipeline({ layout: device.createPipelineLayout({ bindGroupLayouts: [vbgl] }),
    vertex: { module: vmod, entryPoint: "vs" }, fragment: { module: vmod, entryPoint: "fs", targets: [{ format }] } });
  const vbg = device.createBindGroup({ layout: vbgl, entries: [{ binding: 0, resource: { buffer } }] });
  const readback = device.createBuffer({ size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  function encode(dispatches, present) {
    const enc = device.createCommandEncoder();
    if (dispatches > 0) {
      const pass = enc.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bg);
      for (let i = 0; i < dispatches; i += 1) pass.dispatchWorkgroups(cmd.x, cmd.y, cmd.z);
      pass.end();
    }
    if (present) {
      const rp = enc.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: "clear", storeOp: "store" }] });
      rp.setPipeline(vpipe);
      rp.setBindGroup(0, vbg);
      rp.draw(3);
      rp.end();
    }
    device.queue.submit([enc.finish()]);
  }
  async function verify() {
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(buffer, 0, readback, 0, size);
    device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
    await readback.mapAsync(GPUMapMode.READ);
    const digest = hex(await crypto.subtle.digest("SHA-256", readback.getMappedRange().slice(0)));
    readback.unmap();
    return { expected: oracle.expected_sha256, actual: digest, matched: digest === oracle.expected_sha256 };
  }
  const nextFrame = () => new Promise((r) => requestAnimationFrame(r));

  // First job: warmup dispatch, zero reset, oracle dispatches, exact readback, first presented frame.
  encode(cmd.warmup_dispatch_count, false);
  await device.queue.onSubmittedWorkDone();
  device.queue.writeBuffer(buffer, 0, zeros);
  await nextFrame();
  encode(oracle.dispatch_count, true);
  await device.queue.onSubmittedWorkDone();
  S.oracle = await verify();
  S.firstJobDoneT = performance.now();
  if (!S.oracle.matched) throw new Error(`oracle mismatch ${S.oracle.actual}`);
  S.state = "ready";
  statusEl.textContent = "WebGPU active";

  S.runOps = async (n) => {
    S.state = "running";
    for (let i = 0; i < n; i += 1) {
      await nextFrame();
      const t0 = performance.now();
      device.queue.writeBuffer(buffer, 0, zeros);
      encode(cmd.repeat, true);
      const t1 = performance.now();
      await device.queue.onSubmittedWorkDone();
      const t2 = performance.now();
      S.ops.push({ encodeSubmitMs: t1 - t0, completeMs: t2 - t0 });
    }
    S.finalOracle = await verify();
    // Re-present the verified state so the screenshot shows it.
    await nextFrame();
    encode(0, true);
    await device.queue.onSubmittedWorkDone();
    S.state = "done";
    return S.finalOracle;
  };
} catch (error) {
  S.state = "error";
  S.error = String(error);
  statusEl.textContent = `Error: ${error.message ?? error}`;
}
</script>
</body>
</html>
