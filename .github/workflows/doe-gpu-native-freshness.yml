name: doe-gpu native freshness

# Enforces the publish-time contract that platform packages
# (doe-gpu-linux-x64, doe-gpu-darwin-arm64) cannot ship a libwebgpu_doe.so
# that predates the current WGSL compiler source tree. Runs on every PR
# touching either the Zig WGSL compiler source or the staging scripts,
# so the freshness guard cannot regress silently.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/doe-gpu-native-freshness.yml"
      - "runtime/zig/build.zig"
      - "runtime/zig/src/compiler/wgsl/**"
      - "runtime/zig/src/native/shader/doe_shader_translation_cache.zig"
      - "runtime/zig/src/runtime/cache/pipeline_cache.zig"
      - "packages/doe-gpu/scripts/**"
      - "packages/doe-gpu/examples/*-first-kernel.mjs"
      - "packages/doe-gpu/package.json"
      - "packages/doe-gpu/test/integration/test-integration-native-clean-install.js"
      - "packages/doe-gpu/test/integration/test-integration-native-clean-install-reliability.js"
      - "packages/doe-gpu/test/fixtures/native-clean-install-lifecycle.mjs"
      - "packages/doe-gpu/test/unit/stage-platform-freshness.test.js"
      - "packages/doe-gpu-linux-x64/package.json"
      - "packages/doe-gpu-darwin-arm64/package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/doe-gpu-native-freshness.yml"
      - "runtime/zig/build.zig"
      - "runtime/zig/src/compiler/wgsl/**"
      - "runtime/zig/src/native/shader/doe_shader_translation_cache.zig"
      - "runtime/zig/src/runtime/cache/pipeline_cache.zig"
      - "packages/doe-gpu/scripts/**"
      - "packages/doe-gpu/examples/*-first-kernel.mjs"
      - "packages/doe-gpu/package.json"
      - "packages/doe-gpu/test/integration/test-integration-native-clean-install.js"
      - "packages/doe-gpu/test/integration/test-integration-native-clean-install-reliability.js"
      - "packages/doe-gpu/test/fixtures/native-clean-install-lifecycle.mjs"
      - "packages/doe-gpu/test/unit/stage-platform-freshness.test.js"
      - "packages/doe-gpu-linux-x64/package.json"
      - "packages/doe-gpu-darwin-arm64/package.json"

permissions:
  contents: read

concurrency:
  group: doe-gpu-native-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness-guard-unit:
    # Pure-JS unit test of the source-tree hasher mirror. Runs on a
    # plain runner because it does not need the Zig toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run freshness guard unit test
        run: node --test packages/doe-gpu/test/unit/stage-platform-freshness.test.js

  rebuild-then-stage:
    # End-to-end: build the drop-in .so from source, stage the platform
    # package, and verify the freshness guard accepts the fresh artifact.
    # Then simulate staleness by rewriting the metadata hash and assert
    # the guard rejects it with the typed error.
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - linux
      - amd-vulkan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install pinned Electron main-process runtime
        env:
          ELECTRON_VERSION: "43.4.0"
        run: |
          electron_root="$RUNNER_TEMP/doe-electron-main-process"
          npm install \
            --prefix "$electron_root" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            "electron@$ELECTRON_VERSION"
          node "$electron_root/node_modules/electron/install.js"
          electron_executable="$electron_root/node_modules/electron/dist/electron"
          test "$("$electron_executable" --headless --no-sandbox --disable-gpu --version)" = \
            "v$ELECTRON_VERSION"
          echo "DOE_ELECTRON_EXECUTABLE=$electron_executable" >> "$GITHUB_ENV"

      - name: zig build dropin
        working-directory: runtime/zig
        run: zig build dropin -Doptimize=ReleaseFast

      - name: Stage linux-x64 package (must succeed against fresh build)
        working-directory: packages/doe-gpu-linux-x64
        run: npm run stage

      - name: Verify Node clean install from staged packages
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-clean-install

      - name: Verify Bun clean install from staged packages
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-clean-install:bun

      - name: Verify Electron main-process clean install from staged packages
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-clean-install:electron

      - name: Verify Node installed-package reliability
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-reliability

      - name: Verify Bun installed-package reliability
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-reliability:bun

      - name: Verify Electron main-process installed-package reliability
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-reliability:electron

      - name: Inject stale hash and confirm stage refuses
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('runtime/zig/zig-out/share/doe-build-metadata.json')
          doc = json.loads(path.read_text())
          doc['wgslCompilerSourceSha256'] = 'c0ffee' * 10 + 'abcd'
          path.write_text(json.dumps(doc, indent=2))
          PY
          set +e
          (cd packages/doe-gpu-linux-x64 && node ../doe-gpu/scripts/stage-platform-package.js) > /tmp/stage-stale.log 2>&1
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "FAIL: stage returned 0 with a stale metadata hash; freshness guard regressed."
            cat /tmp/stage-stale.log
            exit 1
          fi
          grep -q 'predates the current' /tmp/stage-stale.log || {
            echo "FAIL: stage exited nonzero but did not emit the typed 'predates the current' message."
            cat /tmp/stage-stale.log
            exit 1
          }
          echo "ok: stage refused stale metadata with the typed error."

      - name: Rebuild and re-stage to leave the workspace clean
        run: |
          cd runtime/zig && zig build dropin -Doptimize=ReleaseFast
          cd ../../packages/doe-gpu-linux-x64 && npm run stage
