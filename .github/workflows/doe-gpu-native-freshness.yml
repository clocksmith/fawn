name: doe-gpu native freshness

# Build and stage the committed C provider and verify source/hash rejection.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doe-gpu-native-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness-guard-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run freshness guard unit test
        run: node --test packages/doe-gpu/test/unit/{c-native-stage,stage-platform-freshness}.test.js

  rebuild-then-stage:
    runs-on:
      - self-hosted
      - linux
      - amd-vulkan
    env:
      DOE_WEBGPU_LIB: ""
      DOE_LIB: ""
      DOE_NAPI_ADDON: ""
      DOE_SKIP_NATIVE_REBUILD: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install pinned Electron main-process runtime
        env:
          ELECTRON_VERSION: "43.4.0"
        run: |
          electron_root="$RUNNER_TEMP/doe-electron-main-process"
          npm install \
            --prefix "$electron_root" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            "electron@$ELECTRON_VERSION"
          node "$electron_root/node_modules/electron/install.js"
          electron_executable="$electron_root/node_modules/electron/dist/electron"
          test "$("$electron_executable" --headless --no-sandbox --disable-gpu --version)" = \
            "v$ELECTRON_VERSION"
          echo "DOE_ELECTRON_EXECUTABLE=$electron_executable" >> "$GITHUB_ENV"

      - name: Select a fresh C staging directory
        run: echo "DOE_C_STAGE=$RUNNER_TEMP/doe-c-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Build and stage the C package and Node addon at the Linux glibc floor
        run: |
          target=x86_64-linux-gnu.2.34
          cc="zig cc -target $target"
          make -C runtime/c package REVISION=HEAD GLIBC_FLOOR=2.34 \
            CC="$cc" CXX="zig c++ -target $target" BUILD="$DOE_C_STAGE-build" STAGE="$DOE_C_STAGE"
          CC="$cc" npm --prefix packages/doe-gpu run build:addon
          npm --prefix packages/doe-gpu-linux-x64 run stage

      - name: Verify Node clean install from staged packages
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-clean-install

      - name: Verify Bun clean install from staged packages
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-clean-install:bun

      - name: Verify Electron main-process clean install from staged packages
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-clean-install:electron

      - name: Verify Node installed-package reliability
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-reliability

      - name: Verify Bun installed-package reliability
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-reliability:bun

      - name: Verify Electron main-process installed-package reliability
        working-directory: packages/doe-gpu
        run: npm run test:integration:native-reliability:electron

      - name: Stage rejects a stale C source hash and accepts the restored manifest
        working-directory: packages/doe-gpu-linux-x64
        run: |
          set -euo pipefail
          manifest="$DOE_C_STAGE/MANIFEST.json"
          backup="$(mktemp)"
          log="$(mktemp)"
          cp "$manifest" "$backup"
          trap 'cp "$backup" "$manifest"; rm -f "$backup" "$log"' EXIT
          python3 - "$manifest" <<'PYTHON'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          manifest = json.loads(path.read_text())
          source = next(name for name in manifest["source_inputs"]
                        if name.startswith("runtime/c/") and name.endswith(".c"))
          manifest["source_inputs"][source] = "0" * 64
          path.write_text(json.dumps(manifest))
          PYTHON
          if npm run stage > "$log" 2>&1; then
            echo "stage accepted a stale C source hash" >&2
            exit 1
          fi
          cat "$log"
          grep -F "C package predates or differs from source:" "$log"
          cp "$backup" "$manifest"
          npm run stage
