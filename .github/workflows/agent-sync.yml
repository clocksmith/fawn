name: fawn-agent-sync

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fawn-agent-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check CLAUDE.md/GEMINI.md are symlinks to AGENTS.md
        run: |
          for name in CLAUDE.md GEMINI.md; do
            test -L "$name" && test "$(readlink "$name")" = AGENTS.md || { echo "$name must be a symlink to AGENTS.md"; exit 1; }
          done
      - name: Check CI workflow contracts
        run: python3 bench/tests/test_ci_workflow_surface.py
