name: c-windows-package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c-windows-package.yml'
      - 'runtime/c/tools/build-native-package.py'
      - 'runtime/c/native/tests/audit-exports.py'
  workflow_dispatch:
    inputs:
      exact_revision:
        description: Exact 40-character Doe commit to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EXACT_REVISION: ${{ inputs.exact_revision || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.exact_revision || github.sha }}
          clean: true
      - name: Bind source and discover the existing Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXACT_REVISION -notmatch '^[0-9a-f]{40}$') { throw 'full lowercase commit required' }
          if ((git rev-parse HEAD).Trim() -ne $env:EXACT_REVISION) { throw 'revision mismatch' }
          if (git status --short) { throw 'source checkout is not clean' }
          $evidence = Join-Path $env:RUNNER_TEMP 'doe-c-windows-package'
          New-Item -ItemType Directory $evidence | Out-Null
          "EVIDENCE_ROOT=$evidence" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (!$installation) { throw 'Windows SDK developer toolchain unavailable' }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          if (!(Test-Path $devcmd)) { throw 'developer command environment missing' }
          "DEVCMD=$devcmd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify the retained official DXC SDK package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:EVIDENCE_ROOT 'dxc_2026_09_29.zip'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $archive
          $expected = 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'DXC digest mismatch' }
          $root = Join-Path $env:EVIDENCE_ROOT 'dxc-sdk'
          Expand-Archive $archive $root
          "DXC_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $expected | Set-Content "$env:EVIDENCE_ROOT/dxc-archive.sha256"
      - name: Build, relocate and consume the C-only package without a device
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'runtime/c/tools/build-native-package.py'
          $build = Join-Path $env:EVIDENCE_ROOT 'build'
          $stage = Join-Path $env:EVIDENCE_ROOT 'stage'
          $command = 'call "' + $env:DEVCMD + '" -arch=x64 >nul && python "' + $script + '" --ref ' + $env:EXACT_REVISION + ' --build "' + $build + '" --destination "' + $stage + '" --dxc-root "' + $env:DXC_ROOT + '"'
          $command | Set-Content "$env:EVIDENCE_ROOT/command.txt"
          & cmd.exe /d /s /c $command 2>&1 | Tee-Object "$env:EVIDENCE_ROOT/package.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows package check failed: $LASTEXITCODE" }
          if (!(Test-Path "$stage/MANIFEST.json")) { throw 'package completion marker missing' }
          if (git status --short) { throw 'package changed source checkout' }
      - name: Retain source-bound outputs and first failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c-windows-package-${{ env.EXACT_REVISION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/doe-c-windows-package/package.log
            ${{ runner.temp }}/doe-c-windows-package/command.txt
            ${{ runner.temp }}/doe-c-windows-package/dxc-archive.sha256
            ${{ runner.temp }}/doe-c-windows-package/build/*.log
            ${{ runner.temp }}/doe-c-windows-package/build/SOURCE_INPUTS.json
            ${{ runner.temp }}/doe-c-windows-package/build/objects/*scope.json
            ${{ runner.temp }}/doe-c-windows-package/build/objects/*toolchain.txt
            ${{ runner.temp }}/doe-c-windows-package/build/objects/compiler/scope.json
            ${{ runner.temp }}/doe-c-windows-package/stage/
          if-no-files-found: error
