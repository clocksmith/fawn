name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and consume the C compiler shared library
        run: |
          make -C runtime/c/compiler -j2 build/native_consumer
          runtime/c/compiler/build/native_consumer bench/inference-pipeline/kernels/residual.wgsl
