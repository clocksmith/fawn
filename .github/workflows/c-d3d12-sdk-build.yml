name: c-d3d12-sdk-build

on:
  workflow_dispatch:
    inputs:
      exact_revision:
        description: Exact 40-character Doe commit to compile with the Windows SDK
        required: true
        type: string
      run_warp:
        description: Also execute the explicit CPU WARP compute/readback control
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sdk-build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.exact_revision }}
          clean: true
      - name: Bind source and discover the installed SDK toolchain
        shell: pwsh
        env:
          EXACT_REVISION: ${{ inputs.exact_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXACT_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'exact_revision must be a full lowercase Git commit'
          }
          if ((git rev-parse HEAD).Trim() -ne $env:EXACT_REVISION) {
            throw 'checked-out revision mismatch'
          }
          if (git status --short) { throw 'source checkout is not clean' }
          $evidence = Join-Path $env:RUNNER_TEMP 'doe-c-d3d12-sdk'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          "EVIDENCE_ROOT=$evidence" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:EXACT_REVISION | Set-Content "$evidence/commit.txt"
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription | Set-Content "$evidence/host.txt"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json |
            Set-Content "$evidence/visual-studio.json"
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (!$installation) { throw 'MSVC toolchain missing from hosted image' }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          if (!(Test-Path $devcmd)) { throw 'MSVC developer environment missing' }
          "DEVCMD=$devcmd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile and link the actual C D3D12 owner and native clients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OUT = Join-Path $env:EVIDENCE_ROOT 'build'
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          $owner = Join-Path $env:GITHUB_WORKSPACE 'runtime/c/backends/d3d12'
          $command = 'call "' + $env:DEVCMD + '" -arch=x64 >nul && (set WindowsSDKVersion & set VCToolsVersion & where cl) && call build_windows.cmd'
          $command | Set-Content "$env:EVIDENCE_ROOT/command.txt"
          Push-Location $owner
          try {
            & cmd.exe /d /s /c $command 2>&1 | Tee-Object "$env:EVIDENCE_ROOT/build.log"
            if ($LASTEXITCODE -ne 0) { throw "SDK build failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          if (git status --short) { throw 'build changed source checkout' }
          Get-ChildItem $env:OUT -File | Get-FileHash -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json | Set-Content "$env:EVIDENCE_ROOT/artifacts.json"
          'Actual Windows SDK compile/link only. Built GPU clients were not executed; this is not D3D12 device qualification.' |
            Set-Content "$env:EVIDENCE_ROOT/SCOPE.txt"
      - name: Execute the explicit CPU WARP correctness control
        if: ${{ inputs.run_warp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OUT = Join-Path $env:EVIDENCE_ROOT 'build'
          $env:WARP_EVIDENCE = Join-Path $env:EVIDENCE_ROOT 'warp'
          New-Item -ItemType Directory -Force $env:WARP_EVIDENCE | Out-Null
          'SDK compile/link passed. Explicit CPU WARP control requested; retained logs determine its outcome. No physical GPU, public native D3D12 frontend, performance or full qualification claim.' |
            Set-Content "$env:EVIDENCE_ROOT/SCOPE.txt"
          $owner = Join-Path $env:GITHUB_WORKSPACE 'runtime/c/backends/d3d12'
          $runner = Join-Path $env:WARP_EVIDENCE 'run.cmd'
          $command = 'call "' + $env:DEVCMD + '" -arch=x64 >nul && call "' + (Join-Path $owner 'run_warp.cmd') + '"'
          @('@echo off', $command, 'exit /b %errorlevel%') | Set-Content $runner -Encoding ascii
          $stdout = Join-Path $env:WARP_EVIDENCE 'stdout.txt'
          $stderr = Join-Path $env:WARP_EVIDENCE 'stderr.txt'
          $arguments = '/d /s /c ""' + $runner + '""'
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList $arguments -WorkingDirectory $owner -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (!$process.WaitForExit(120000)) {
            & taskkill.exe /PID $process.Id /T /F
            throw 'WARP child exceeded its 120-second external deadline'
          }
          $process.WaitForExit()
          $process.Refresh()
          $process.ExitCode | Set-Content "$env:WARP_EVIDENCE/exit-code.txt"
          Get-Content $stdout
          Get-Content $stderr
          if ($process.ExitCode -ne 0) { throw "WARP control failed: $($process.ExitCode)" }
          $fxc = (Get-Content (Join-Path $env:WARP_EVIDENCE 'fxc-path.txt') -Raw).Trim()
          if (!(Test-Path $fxc -PathType Leaf)) { throw 'recorded SDK shader compiler is missing' }
          @{
            path = $fxc
            sha256 = (Get-FileHash $fxc -Algorithm SHA256).Hash
            fileVersion = (Get-Item $fxc).VersionInfo.FileVersion
          } | ConvertTo-Json | Set-Content "$env:WARP_EVIDENCE/fxc.json"
          if (git status --short) { throw 'WARP control changed source checkout' }
          Get-ChildItem $env:WARP_EVIDENCE -File | Get-FileHash -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json | Set-Content "$env:EVIDENCE_ROOT/warp-artifacts.json"
          'Actual Windows SDK compile/link and explicit CPU WARP compute/readback/cleanup only. No physical GPU, public native D3D12 frontend, performance or full qualification claim.' |
            Set-Content "$env:EVIDENCE_ROOT/SCOPE.txt"
      - name: Retain source-bound build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c-d3d12-sdk-${{ inputs.exact_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/doe-c-d3d12-sdk/
          if-no-files-found: error
