name: WebGPU package surface

# Broader qualification is explicit; see docs/process.md#continuous-integration.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgpu-package-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-surface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/doe-gpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run package contract and smoke tests
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run --json
