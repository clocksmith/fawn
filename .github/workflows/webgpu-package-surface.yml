name: WebGPU package surface

on:
  pull_request:
    paths:
      - ".github/workflows/webgpu-package-surface.yml"
      - "packages/doe-gpu/**"
      - "config/tool-surfaces.json"
      - "bench/gates/tool_surface_gate.py"
      - "bench/tests/test_tool_surface_gate.py"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/webgpu-package-surface.yml"
      - "packages/doe-gpu/**"
      - "config/tool-surfaces.json"
      - "bench/gates/tool_surface_gate.py"
      - "bench/tests/test_tool_surface_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgpu-package-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-surface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/doe-gpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run complete package surface and clean-install tests
        run: npm test
      - name: Verify public tool-surface declaration
        working-directory: .
        run: python3 bench/gates/tool_surface_gate.py
      - name: Verify package contents
        run: npm pack --dry-run --json
