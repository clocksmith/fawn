name: wgsl-compiler

on:
  pull_request:
    paths:
      - ".github/workflows/wgsl-compiler.yml"
      - "runtime/zig/**"
      - "config/**"
      - "pipeline/lean/Doe/**"
      - "pipeline/lean/artifacts/proven-conditions.json"
      - "bench/tools/bootstrap_zig.py"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/wgsl-compiler.yml"
      - "runtime/zig/**"
      - "config/**"
      - "pipeline/lean/Doe/**"
      - "pipeline/lean/artifacts/proven-conditions.json"
      - "bench/tools/bootstrap_zig.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wgsl-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wgsl-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install configured Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 bench/tools/bootstrap_zig.py
          zig_version="$(jq -r '.toolchains.zig.version' config/toolchains.json)"
          echo "$GITHUB_WORKSPACE/.tooling/zig-${zig_version}" >> "$GITHUB_PATH"
      - name: Check Zig formatting
        working-directory: runtime/zig
        run: zig build fmt-check
      - name: Run WGSL compiler tests
        working-directory: runtime/zig
        run: |
          zig build test-wgsl
          zig build test-wgsl -Dlean-verified=true
