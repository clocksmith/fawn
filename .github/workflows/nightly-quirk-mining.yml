name: nightly-quirk-mining

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dawn-tint-upstream-intelligence
  cancel-in-progress: false

jobs:
  synchronize-upstream-intelligence:
    runs-on:
      - self-hosted
      - linux
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Restore durable intelligence state
        uses: actions/cache@v4
        with:
          path: bench/out/upstream-intelligence/state.sqlite3
          key: upstream-intelligence-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-intelligence-v1-${{ runner.os }}-

      - name: Validate intelligence contracts
        run: |
          python3 -m unittest pipeline.upstream_intelligence.test_upstream_intelligence
          python3 -m unittest bench.tests.test_config_schemas

      - name: Mine upstream quirks (all backends)
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          MINING_ROOT="bench/out/mined-quirks/${STAMP}"
          echo "MINING_ROOT=${MINING_ROOT}" >> "$GITHUB_ENV"
          DAWN_COMMIT="$(git -C bench/vendor/dawn rev-parse HEAD)"

          for VENDOR in intel amd nvidia; do
            for API in vulkan metal d3d12; do
              python3 pipeline/agent/mine_upstream_quirks.py \
                --source-root bench/vendor/dawn/src/dawn/native/vulkan \
                --source-root bench/vendor/dawn/src/dawn/native/metal \
                --source-root bench/vendor/dawn/src/dawn/native/d3d12 \
                --source-repo dawn/main \
                --source-commit "$DAWN_COMMIT" \
                --vendor "$VENDOR" \
                --api "$API" \
                --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --output "${MINING_ROOT}/quirks.${VENDOR}.${API}.json" \
                --manifest-output "${MINING_ROOT}/quirks.${VENDOR}.${API}.manifest.json"
            done
          done

      - name: Validate mined quirks against schema
        run: python3 -m unittest pipeline.agent.test_mine_quirks

      - name: Require model credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Synchronize Gerrit, issues, source signals, and model packets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          SOURCE_ARGS=()
          while IFS= read -r MANIFEST; do
            SOURCE_ARGS+=(--source-manifest "$MANIFEST")
          done < <(find "$MINING_ROOT" -name '*.manifest.json' -type f | sort)
          python3 -m pipeline.upstream_intelligence \
            --require-llm \
            sync \
            "${SOURCE_ARGS[@]}"

      - name: Upload intelligence and mining artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-quirk-mining
          retention-days: 30
          path: |
            bench/out/mined-quirks/**/*.json
            bench/out/upstream-intelligence/runs/**/*
