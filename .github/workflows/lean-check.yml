name: fawn-lean-check

on:
  pull_request:
    paths:
      - ".github/workflows/lean-check.yml"
      - "pipeline/lean/**"
      - "config/toolchains.json"
      - "config/comparability-obligations.json"
      - "config/lean-proof-patterns.json"
      - "config/proof-artifact.schema.json"
      - "bench/native_compare_modules/comparability.py"
      - "runtime/zig/src/compiler/wgsl/emit/msl/emit_msl_ir.zig"
      - "runtime/zig/src/compiler/wgsl/ir/ir_transform_robustness.zig"
      - "runtime/zig/src/compiler/wgsl/mod.zig"
      - "runtime/zig/src/native/compute/doe_compute_bind_groups.zig"
      - "runtime/zig/src/native/resource/doe_buffer_ops_native.zig"
      - "runtime/zig/src/quirk/runtime.zig"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/lean-check.yml"
      - "pipeline/lean/**"
      - "config/toolchains.json"
      - "config/comparability-obligations.json"
      - "config/lean-proof-patterns.json"
      - "config/proof-artifact.schema.json"
      - "bench/native_compare_modules/comparability.py"
      - "runtime/zig/src/compiler/wgsl/emit/msl/emit_msl_ir.zig"
      - "runtime/zig/src/compiler/wgsl/ir/ir_transform_robustness.zig"
      - "runtime/zig/src/compiler/wgsl/mod.zig"
      - "runtime/zig/src/native/compute/doe_compute_bind_groups.zig"
      - "runtime/zig/src/native/resource/doe_buffer_ops_native.zig"
      - "runtime/zig/src/quirk/runtime.zig"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fawn-lean-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Typecheck and extract proof artifacts
        run: bash pipeline/lean/extract.sh
      - name: Validate proof artifact
        run: python3 pipeline/lean/test_proof_pipeline.py
      - name: Upload proof artifact
        uses: actions/upload-artifact@v7
        with:
          name: proven-conditions
          path: pipeline/lean/artifacts/proven-conditions.json
