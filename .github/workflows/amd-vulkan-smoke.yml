name: amd-vulkan-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on:
      - self-hosted
      - linux
      - amd-vulkan
    env:
      CONFIG_PATH: bench/native-compare/compare.config.amd.vulkan.smoke.gpu.json
      REPORT_PATH: bench/out/dawn-vs-doe.amd.vulkan.smoke.gpu.compute.json
      WORKSPACE_PATH: bench/out/runtime-comparisons.amd.vulkan.smoke.gpu.compute
    steps:
      - uses: actions/checkout@v7
      - name: Run canonical smoke pipeline
        run: |
          python3 bench/runners/run_release_pipeline.py --config "$CONFIG_PATH" --report "$REPORT_PATH" --strict-amd-vulkan --local-vulkan-lane vulkan_doe_comparable --verify-smoke-report "$REPORT_PATH" --verify-smoke-require-comparable
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: amd-vulkan-smoke-report
          path: |
            ${{ env.REPORT_PATH }}
            bench/out/**/dawn-vs-doe.amd.vulkan.smoke.gpu.compute*.json
            bench/out/**/dawn-vs-doe.amd.vulkan.smoke.gpu.compute*.html
            ${{ env.WORKSPACE_PATH }}
            bench/out/**/runtime-comparisons.amd.vulkan.smoke.gpu.compute*
            bench/out/**/run_manifest.json
